[project]
name = "malaria-cell-classification"
version = "0.1.0"
description = "A learning-focused computer-vision project for malaria cell image classification."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
